<svg viewBox="0 0 1180 384" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Yomi logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123E42"/>
      <stop offset="1" stop-color="#0A2528"/>
    </linearGradient>
    <linearGradient id="jade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6FEFCB"/>
      <stop offset="1" stop-color="#2ED3A6"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB454" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFB454" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFB454" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1180" height="384" rx="72" fill="url(#bg)"/>

  <!-- icon, scaled and inset -->
  <g transform="translate(64,64) scale(0.5)">
    <g fill="#35E0B0" opacity="0.12">
      <rect x="150" y="150" width="18" height="18" rx="5"/>
      <rect x="344" y="150" width="18" height="18" rx="5"/>
      <rect x="150" y="344" width="18" height="18" rx="5"/>
      <rect x="344" y="344" width="18" height="18" rx="5"/>
    </g>
    <g fill="none" stroke="url(#jade)" stroke-width="16" stroke-linecap="round" opacity="0.92">
      <path d="M112 160 L112 112 L160 112"/>
      <path d="M352 112 L400 112 L400 160"/>
      <path d="M112 352 L112 400 L160 400"/>
      <path d="M352 400 L400 400 L400 352"/>
    </g>
    <rect x="186" y="186" width="140" height="140" rx="34" fill="none" stroke="url(#jade)" stroke-width="26"/>
    <rect x="232" y="232" width="48" height="48" rx="14" fill="#FFB454"/>
    <g filter="url(#glow)">
      <rect x="120" y="252" width="272" height="7" rx="3.5" fill="url(#scan)"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="438" y="248" font-family="Poppins, Inter, 'Segoe UI', system-ui, sans-serif"
        font-size="176" font-weight="600" letter-spacing="-6" fill="#E9F7F2">yomi</text>

  <!-- accent module echoing the icon center -->
  <rect x="966" y="206" width="34" height="34" rx="9" fill="#FFB454"/>
</svg>
